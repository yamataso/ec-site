# http://ホスト名:7777/ec-siteにアクセスするための記述
spring.application.name=ec_site
server.servlet.context-path=/ec_site
server.port=7777
spring.thymeleaf.cache=false

# MySQLの接続設定
spring.datasource.url=jdbc:mysql://localhost:8889/ec-site?useSSL=false&serverTimezone=Asia/Tokyo
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPAの設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 発行されるSQLをコンソールに表示する設定
spring.jpa.show-sql=true